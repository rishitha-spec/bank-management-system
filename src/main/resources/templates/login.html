<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Management System - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }

        .login-container {
            width: 90%;
            max-width: 400px;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px #00000015;
        }

        h1 {
            text-align: center;
            color: #183153;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #183153;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #254a78;
        }

        .message {
            margin-top: 15px;
            text-align: center;
        }

        .error {
            color: #c62828;
        }

        .logout {
            color: #218838;
        }
    </style>
</head>

<body>
<div class="login-container">

    <h1>🏦 Bank Management</h1>
    <p class="subtitle">Sign in to access your banking dashboard</p>

    <p class="message error"
       th:if="${param.error}">
        Invalid username or password.
    </p>

    <p class="message logout"
       th:if="${param.logout}">
        You have logged out successfully.
    </p>

    <form th:action="@{/login}" method="post">

        <label for="username">Username</label>
        <input type="text"
               id="username"
               name="username"
               placeholder="Enter your username"
               autocomplete="username"
               required
               autofocus>

        <label for="password">Password</label>
        <input type="password"
               id="password"
               name="password"
               placeholder="Enter your password"
               autocomplete="current-password"
               required>

        <button type="submit">Login</button>

    </form>

</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Account</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
            padding: 40px 15px;
        }

        .container {
            max-width: 420px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px #ddd;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            box-sizing: border-box;
        }

        button {
            background: #c62828;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 5px;
            cursor: pointer;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Delete Account</h1>

    <p>Enter the account number you want to delete.</p>

    <p class="error">
        Warning: This action cannot be undone.
    </p>

    <p class="success"
       th:if="${success}"
       th:text="${success}"></p>

    <p class="error"
       th:if="${error}"
       th:text="${error}"></p>

    <form th:action="@{/delete-account}" method="post"
      onsubmit="return confirm('Are you sure you want to delete this account?');">
        <input type="number"
               name="acno"
               placeholder="Account Number"
               min="1"
               required>

        <br>

        <button type="submit">Delete Account</button>
    </form>

    <br>
    <a href="/">Back to Home</a>

</div>
</body>
</html>
